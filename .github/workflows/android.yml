name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: set -o pipefail; ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee -a build.log

      - name: Lint
        run: set -o pipefail; ./gradlew --stacktrace lintRelease 2>&1 | tee -a build.log

      # Signing and real AdMob IDs are optional repository secrets. Without them the release
      # outputs are unsigned and use Google's test ad units.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "FRAME_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and App Bundle
        env:
          FRAME_KEYSTORE_PASSWORD: ${{ secrets.FRAME_KEYSTORE_PASSWORD }}
          FRAME_KEY_ALIAS: ${{ secrets.FRAME_KEY_ALIAS }}
          FRAME_KEY_PASSWORD: ${{ secrets.FRAME_KEY_PASSWORD }}
          FRAME_ADMOB_APP_ID: ${{ secrets.FRAME_ADMOB_APP_ID }}
          FRAME_ADMOB_BANNER_ID: ${{ secrets.FRAME_ADMOB_BANNER_ID }}
        run: set -o pipefail; ./gradlew --stacktrace assembleRelease bundleRelease 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: frame-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Mirrors the build log to the ci-results branch so it can be read with plain git.
      - name: Publish CI result
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/ 2>/dev/null || echo "no log" > /tmp/ci/build.log
          find app/build/reports -name "*.txt" -exec cp {} /tmp/ci/ \; 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }} ${{ github.ref_name }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results

  smoke-test:
    name: device tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standard
            api: 34
            cores: 4
            ram: 4096M
            heap: 512M
            branch: ci-smoke
          # A deliberately weak phone: Android 10, 2 cores, 1.5 GB RAM, 128 MB app heap.
          - profile: lowend
            api: 29
            cores: 2
            ram: 1536M
            heap: 128M
            branch: ci-smoke-lowend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate sample media
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          ffmpeg -y -f lavfi -i testsrc=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/sample.mp4
          ffmpeg -y -f lavfi -i sine=frequency=660:sample_rate=44100 -t 4 -c:a aac /tmp/sample.m4a
          ffmpeg -y -f lavfi -i testsrc2=size=640x480 -frames:v 1 /tmp/sample.png
          # A 120 BPM metronome for the beat-detection device test.
          ffmpeg -y -f lavfi -i "aevalsrc=0.8*sin(2*PI*880*t)*exp(-mod(t\,0.5)*60):s=44100" -t 12 -c:a aac -b:a 128k /tmp/beats.m4a
          # A 48 MP photo, like a modern phone camera produces.
          ffmpeg -y -f lavfi -i testsrc2=size=8000x6000 -frames:v 1 -q:v 4 /tmp/big.jpg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram }}
          heap-size: ${{ matrix.heap }}
          disable-animations: true
          script: bash scripts/smoke-test.sh

      - name: Publish smoke result
        if: always()
        run: |
          mkdir -p /tmp/smoke
          cp smoke.log /tmp/smoke/ 2>/dev/null || echo "no log" > /tmp/smoke/smoke.log
          cp smoke.png /tmp/smoke/ 2>/dev/null || true
          cp -r shots /tmp/smoke/ 2>/dev/null || true
          cp perf.log /tmp/smoke/ 2>/dev/null || true
          cp media.log /tmp/smoke/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }} ${{ github.ref_name }} ${{ matrix.profile }}" > /tmp/smoke/status.txt
          cd /tmp/smoke
          git init -q
          git checkout -q -b ${{ matrix.branch }}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Smoke ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ${{ matrix.branch }}
