name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace lintRelease

      # Signing and real AdMob IDs are optional repository secrets. Without them the release
      # outputs are unsigned and use Google's test ad units.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "FRAME_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and App Bundle
        env:
          FRAME_KEYSTORE_PASSWORD: ${{ secrets.FRAME_KEYSTORE_PASSWORD }}
          FRAME_KEY_ALIAS: ${{ secrets.FRAME_KEY_ALIAS }}
          FRAME_KEY_PASSWORD: ${{ secrets.FRAME_KEY_PASSWORD }}
          FRAME_ADMOB_APP_ID: ${{ secrets.FRAME_ADMOB_APP_ID }}
          FRAME_ADMOB_BANNER_ID: ${{ secrets.FRAME_ADMOB_BANNER_ID }}
        run: ./gradlew --stacktrace assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: frame-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
