name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: set -o pipefail; ./gradlew --stacktrace testDebugUnitTest 2>&1 | tee -a build.log

      - name: Lint
        run: set -o pipefail; ./gradlew --stacktrace lintRelease 2>&1 | tee -a build.log

      # Signing and real AdMob IDs are optional repository secrets. Without them the release
      # outputs are unsigned and use Google's test ad units.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAME_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          echo "FRAME_KEYSTORE_PATH=release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and App Bundle
        env:
          FRAME_KEYSTORE_PASSWORD: ${{ secrets.FRAME_KEYSTORE_PASSWORD }}
          FRAME_KEY_ALIAS: ${{ secrets.FRAME_KEY_ALIAS }}
          FRAME_KEY_PASSWORD: ${{ secrets.FRAME_KEY_PASSWORD }}
          FRAME_ADMOB_APP_ID: ${{ secrets.FRAME_ADMOB_APP_ID }}
          FRAME_ADMOB_BANNER_ID: ${{ secrets.FRAME_ADMOB_BANNER_ID }}
        run: set -o pipefail; ./gradlew --stacktrace assembleRelease bundleRelease 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: frame-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # Mirrors the build log to the ci-results branch so it can be read with plain git.
      - name: Publish CI result
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/ 2>/dev/null || echo "no log" > /tmp/ci/build.log
          find app/build/reports -name "*.txt" -exec cp {} /tmp/ci/ \; 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }} ${{ github.ref_name }}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results
